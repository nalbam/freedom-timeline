<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freedom Timeline</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      (function () {
        const saved = localStorage.getItem("freedom-timeline-theme");
        const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="container">
      <header>
        <div class="brand">
          <img class="brand-logo" src="./logo.png" alt="Freedom Timeline 로고" width="44" height="44" />
          <div>
            <h1>Freedom Timeline</h1>
            <p>가족/재무 정보를 입력하면 경제적 자유 시점을 즉시 계산합니다.</p>
          </div>
        </div>
        <button id="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
      </header>

      <div class="layout">
        <div class="col col-input">
          <section class="panel">
            <div class="panel-title-row">
              <h2>가족 구성원</h2>
              <button id="add-member-btn" type="button">구성원 추가</button>
            </div>
            <div id="family-list"></div>
          </section>

          <section class="panel">
            <div class="panel-title-row">
              <h2>재무 입력</h2>
              <button id="reset-btn" type="button" class="danger">초기화</button>
            </div>
            <div id="finance-fields" class="field-grid"></div>
            <label class="check-row">
              <input type="checkbox" data-toggle="pensionInflationLinked" />
              연금 물가연동 (수령액이 인플레이션만큼 증가)
            </label>
          </section>

          <section class="panel">
            <div class="panel-title-row">
              <h2>일회성 이벤트</h2>
              <button id="add-event-btn" type="button">이벤트 추가</button>
            </div>
            <div id="event-list"></div>
          </section>
        </div>

        <div class="col col-output">
          <section class="panel">
            <div class="panel-title-row">
              <h2>결과</h2>
              <div class="mode-toggle">
                <button type="button" data-mode="real">오늘 가치</button>
                <button type="button" data-mode="nominal">미래 가치</button>
              </div>
            </div>
            <div id="result-hero"></div>
            <div id="result-cards" class="cards"></div>
          </section>

          <section class="panel">
            <h2>나이별 순자산 그래프</h2>
            <canvas id="networth-chart"></canvas>
          </section>

          <section class="panel">
            <h2>소득 / 지출 비교 그래프</h2>
            <canvas id="cashflow-chart"></canvas>
          </section>

          <section class="panel">
            <h2>몬테카를로 시뮬레이션 (수익률 변동성 반영)</h2>
            <div id="mc-hero"></div>
            <div id="mc-cards" class="cards"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
